services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://parser:secret@db:5432/jobs_db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: parser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: jobs_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parser -d jobs_db"]
      interval: 5s
      timeout: 5s
      retries: 5